name: Weekly Nowcast

on:
  schedule:
    # 21:00 UTC Sunday = 07:00 AEST Monday (08:00 AEDT during daylight savings)
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nowcast-weekly
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Restore R packages (renv)
        env:
          # Windows R uses a User-Agent-aware CRAN mirror; no __linux__ prefix.
          RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
        # Run from repo root (no .Rprofile) so pipeline/.Rprofile doesn't auto-source
        # renv/activate.R. Multi-line Rscript -e strings segfault on Windows under
        # Git Bash (CRLF line endings corrupt the parsed expression), so everything
        # goes on one line.
        run: Rscript -e 'options(repos = c(CRAN = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))); if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv"); lock <- renv::lockfile_read("pipeline/renv.lock"); pkgs <- setdiff(names(lock$Packages), "renv"); renv::restore(project = "pipeline", packages = pkgs, prompt = FALSE)'

      - name: Run nowcast pipeline
        id: nowcast
        working-directory: pipeline
        run: Rscript run_complete_nowcast.R

      - name: Commit updated JSON and vintage index
        id: commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add pipeline/.cache/model_output/vintages/vintage_tracking.csv
          if git diff --staged --quiet; then
            echo "No JSON changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: weekly nowcast $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly nowcast failed ${today}`,
              body: `The weekly nowcast pipeline failed. See logs: ${runUrl}`,
              labels: ["pipeline-failure"]
            });
