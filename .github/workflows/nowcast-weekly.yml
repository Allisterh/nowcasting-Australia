name: Weekly Nowcast

on:
  schedule:
    # 21:00 UTC Sunday = 07:00 AEST Monday (08:00 AEDT during daylight savings)
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nowcast-weekly
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Restore R packages (renv)
        working-directory: pipeline
        env:
          RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
        run: |
          Rscript -e 'options(repos = c(CRAN = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))); install.packages("renv")'
          # Exclude renv itself from the lockfile restore — we already installed it
          # above, and the lockfile's renv entry points at a source that fails to
          # download in CI.
          Rscript -e '
            options(repos = c(CRAN = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE")));
            lock <- renv::lockfile_read();
            pkgs <- setdiff(names(lock$Packages), "renv");
            renv::restore(packages = pkgs, prompt = FALSE)
          '

      - name: Run nowcast pipeline
        id: nowcast
        working-directory: pipeline
        run: Rscript run_complete_nowcast.R

      - name: Commit updated JSON and vintage index
        id: commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add pipeline/.cache/model_output/vintages/vintage_tracking.csv
          if git diff --staged --quiet; then
            echo "No JSON changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: weekly nowcast $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly nowcast failed ${today}`,
              body: `The weekly nowcast pipeline failed. See logs: ${runUrl}`,
              labels: ["pipeline-failure"]
            });
